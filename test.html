<style>
/* Layout: una columna de 560px. Recorrido: inicio, nombre, 8 situaciones, 5 preguntas "sobre vos", resultado con mapa de 15 niveles, brújula y barra fija de contacto. Look oscuro con brillo ámbar, igual que el link-in-bio de la Sala. */
:root {
  color-scheme: dark;
  --bg: #0d0a07;
  --ink: #f5ede2;
  --muted: #b8a999;
  --line: rgba(245, 237, 226, 0.16);
  --glass: rgba(255, 244, 228, 0.06);
  --amber: #f2a43a;
  --amber-deep: #c97a14;
  --on-amber: #1a1005;
  --font: "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  background-image:
    radial-gradient(900px 420px at 50% -140px, rgba(242, 164, 58, 0.30), transparent 70%),
    radial-gradient(560px 320px at 100% 100%, rgba(201, 122, 20, 0.16), transparent 70%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  padding-block: 30px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar { position: fixed; left: 0; right: 0; top: 0; height: 3px; background: var(--line); z-index: 20; }
.topbar i { display: block; height: 100%; width: 0; background: var(--amber); transition: width 0.4s ease; }
.wrap { max-width: 560px; margin: 0 auto; }
.brand { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--amber); font-weight: 700; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 22px; }
.card { border: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-radius: 24px; padding: 28px 22px; }
.screen { animation: rise 0.4s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.pill { display: inline-block; font-size: 12px; font-weight: 600; border: 1px solid rgba(242, 164, 58, 0.45); color: var(--amber); border-radius: 999px; padding: 4px 12px; margin: 0 6px 6px 0; }
h1 { font-size: clamp(27px, 7.4vw, 40px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 800; text-transform: uppercase; margin: 14px 0 14px; text-wrap: balance; }
h1 em, .state em { font-style: normal; color: var(--amber); }
h2 { font-size: clamp(20px, 5.4vw, 25px); line-height: 1.28; letter-spacing: -0.01em; font-weight: 600; margin: 14px 0 18px; text-wrap: balance; outline: none; }
h3 { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--amber); font-weight: 700; margin: 0 0 8px; }
p { margin: 0 0 14px; }
.lead { color: var(--muted); max-width: 46ch; }
.small { color: var(--muted); font-size: 13.5px; }

.eyebrow.amb { color: var(--amber); font-weight: 700; }
.btn { appearance: none; border: 0; font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 15px 24px; background: linear-gradient(180deg, var(--amber), var(--amber-deep)); color: var(--on-amber); box-shadow: 0 8px 30px rgba(242, 164, 58, 0.28); text-decoration: none; display: inline-block; text-align: center; text-transform: uppercase; letter-spacing: 0.04em; font-size: 14px; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
.btn.slim { padding: 10px 18px; font-size: 12.5px; }
.btn:focus-visible, .opt:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, .link:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
.opts { display: grid; gap: 10px; }
.opt { appearance: none; width: 100%; text-align: left; font: inherit; font-size: 15.5px; color: var(--ink); background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 15px 18px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }

.opt.sel { border-color: var(--amber); background: rgba(242, 164, 58, 0.16); }
.nav { margin-top: 18px; text-align: center; }
.link { appearance: none; background: none; border: 0; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; padding: 6px 10px; text-decoration: underline; text-underline-offset: 3px; }

.field label { font-size: 13px; color: var(--muted); }

.state { font-size: clamp(40px, 12vw, 62px); line-height: 1.02; font-weight: 800; letter-spacing: -0.03em; text-transform: uppercase; margin: 8px 0 16px; text-wrap: balance; }
.panel { border: 1px solid var(--line); background: rgba(0, 0, 0, 0.22); border-radius: 20px; padding: 18px 16px; margin: 22px 0 0; }
.map { list-style: none; padding: 0; margin: 10px 0 12px; display: grid; gap: 4px; }
.map li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 12px; border: 1px solid transparent; color: var(--muted); font-size: 15px; }
.map li .v { font-variant-numeric: tabular-nums; font-size: 13px; }
.map li.zone { color: var(--ink); font-weight: 700; background: rgba(242, 164, 58, 0.08); border-color: rgba(242, 164, 58, 0.55); }
.map li .tag { background: var(--amber); color: var(--on-amber); font-size: 10.5px; letter-spacing: 0.1em; font-weight: 800; border-radius: 999px; padding: 3px 9px; margin-left: 8px; }
.map li .nm { min-width: 0; }
.map li.cut { color: var(--amber); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; padding: 2px 0; justify-content: center; gap: 12px; }
.map li.cut::before, .map li.cut::after { content: ""; height: 1px; background: var(--amber); opacity: 0.5; flex: 1; }
.compass { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--line); margin: 6px 0; }
.compass b { display: block; height: 100%; }
.compass .f { background: #6f6a66; }
.compass .p { background: var(--amber); }
.ends { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; }
.quote { border-left: 3px solid var(--amber); padding: 2px 0 2px 14px; margin: 20px 0; font-style: italic; color: var(--ink); }
.box { border: 1px solid var(--line); background: var(--glass); border-radius: 18px; padding: 18px 16px; margin: 0 0 14px; }
.box.hl { border-color: rgba(242, 164, 58, 0.55); }
.box p:last-child { margin-bottom: 0; }
.fallback { width: 100%; margin-top: 10px; font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.logo { width: 76px; height: 76px; object-fit: cover; border-radius: 20px; display: block; box-shadow: 0 0 36px rgba(242, 164, 58, 0.35); }
.brandcol { flex-direction: column; gap: 10px; }
.vs { display: grid; gap: 12px; margin: 18px 0 8px; }
.vs .side { border: 1px solid var(--line); border-radius: 18px; padding: 16px 16px 6px; background: rgba(0, 0, 0, 0.22); }
.vs .side.p { border-color: rgba(242, 164, 58, 0.55); background: rgba(242, 164, 58, 0.07); }
.vs h3 { margin-bottom: 4px; }
.vs .rng { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; }
.vs .side.f h3 { color: var(--muted); }
.stack { list-style: none; padding: 0; margin: 12px 0 14px; display: grid; gap: 10px; }
.stack li { position: relative; padding-left: 26px; font-size: 15px; }
.stack li::before { content: "✓"; position: absolute; left: 0; top: 0; color: var(--amber); font-weight: 800; }
.stack li b { display: block; }
.stack li span { color: var(--muted); font-size: 14px; }
.foot { color: var(--muted); font-size: 12.5px; margin: 18px 6px 0; max-width: 56ch; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

    "ACEPTACIÓN": ["sala", "Estás en un estado para servir. La Sala te da un espacio para compartir lo que aprendiste y seguir creciendo."]
  };
  var PRACT = {"APATÍA": ["Salí a caminar 10 minutos con luz natural, hoy. El movimiento es lo primero que rompe la inercia.", "Elegí UNA tarea de menos de 5 minutos y terminala. Cerrar algo chico devuelve la sensación de poder hacer.", "Hablá con una persona de confianza. No para que te resuelva nada: para que te escuche."], "MIEDO": ["Escribí tu miedo en una frase concreta: «tengo miedo de que…». Un miedo con nombre pesa menos que uno difuso.", "Preguntate: ¿qué es lo peor que puede pasar y cómo lo resolvería? Casi siempre tenés una respuesta.", "Hacé una acción de 5 minutos que roce ese miedo: mandar el mensaje, preguntar el precio, publicar."], "DESEO": ["Anotá 3 cosas que hoy tenés y que alguna vez deseaste. Entrená el registro de lo que ya llegó.", "Elegí UNA meta para la semana. Las demás van a una lista que se llama «después».", "Antes de comprar o empezar algo nuevo, esperá 24 horas. Si sigue teniendo sentido, adelante."], "IRA": ["Regla de la hora: no respondas lo que te enoja hasta que pase una hora.", "Escribí qué querés conseguir de verdad en ese conflicto. Muchas veces es respeto, no ganar.", "Descargá el cuerpo antes de una conversación difícil: caminá rápido o entrená 15 minutos."], "ORGULLO": ["Pedí ayuda concreta en una sola cosa esta semana. Observá qué sentís al hacerlo.", "Contale a alguien algo en lo que no sabés o te equivocaste, sin justificarte.", "En una conversación, hacé una pregunta genuina en lugar de dar tu opinión."], "CORAJE": ["Definí un mínimo diario de 20 minutos que no se negocia, y hacelo incluso los días sin ganas.", "Cada noche anotá una acción valiente del día. Lo que se registra se repite.", "Elegí a una persona que te dé seguimiento semanal. El coraje se sostiene mejor acompañado."], "VOLUNTAD": ["Elegí una obligación y reformulala como elección: «elijo hacerlo porque…».", "Reservá una hora semanal sin objetivo productivo. Es parte del rendimiento, no un lujo.", "Sumate a un grupo donde haya gente un paso más adelante que vos."], "ACEPTACIÓN": ["Reservá 10 minutos diarios de silencio, sin pantalla.", "Enseñale algo que sabés a otra persona esta semana. Enseñar afianza el estado.", "Ante algo que no podés cambiar, escribí: «esto es así; lo que sí depende de mí es…»."]};

  var app = document.getElementById("app");
  var prog = document.getElementById("prog");

  var steps = [{ t: "name" }];
  Q.forEach(function (_, i) { steps.push({ t: "q", i: i }); });
  SEG.forEach(function (_, i) { steps.push({ t: "seg", i: i }); });
  steps.push({ t: "lead" });

  var cur = -1, name = "", order = [], qa = [], sa = [], result = null;

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function setProgress() {
    prog.style.width = (cur < 0 ? 0 : (cur + 1) / (steps.length + 1) * 100) + "%";
  }

  function go(n) {
    cur = n;
    setProgress();
    if (cur < 0) return intro();
    if (cur >= steps.length) return showResult();
    var s = steps[cur];
    if (s.t === "name") return renderName();
    if (s.t === "q") return renderQ(s.i);
    if (s.t === "lead") return renderLead();
    return renderSeg(s.i);
  }

  function back() { go(cur - 1); window.scrollTo(0, 0); }
  function backLink() { return '<div class="nav"><button type="button" class="link" id="back">← Volver</button></div>'; }
  function bindBack() { var b = document.getElementById("back"); if (b) b.addEventListener("click", back); }

  function intro() {
    app.innerHTML =
      '<div class="screen">' +
      '<span class="pill">Sala Despertar</span><span class="pill">Test de consciencia</span>' +
      '<p class="eyebrow amb" style="margin-top:10px">Antes de empezar</p>' +
      "<h1>¿Desde dónde estás operando: <em>fuerza o poder</em>?</h1>" +
      '<p class="lead">Sacá una foto honesta de tu punto de partida. 8 situaciones reales, unos 3 minutos. Al final vas a ver algo que muy poca gente ve de sí misma.</p>' +
      '<div class="panel" style="margin-top:20px"><h3>Fuerza y poder, en simple</h3>' +
      '<p>El Dr. David Hawkins, psiquiatra e investigador de la consciencia, ordenó los estados emocionales en una escala según cuánta energía te dan o te quitan. En su libro «Poder vs. Fuerza» llama <strong>fuerza</strong> a lo que te vacía y <strong>poder</strong> a lo que te llena. La línea que las separa está en el <strong>200</strong>: el coraje.</p>' +
      '<div class="vs">' +
      '<div class="side f"><h3>Fuerza · debajo de 200</h3><p class="rng">Vergüenza, culpa, apatía, miedo, deseo, ira, orgullo.</p>' +
      '<p>Actuás desde la <strong>carencia</strong>: «me falta algo y tengo que conseguirlo, defenderlo o demostrarlo». Se mueve <em>contra</em> algo (una presión, un rival, un miedo), gasta energía y deja cansancio.</p>' +
      '<p class="small">Ejemplo: trabajar 14 horas porque te da miedo que no alcance.</p></div>' +
      '<div class="side p"><h3>Poder · 200 o más</h3><p class="rng">Coraje, neutralidad, voluntad, aceptación, razón, amor, alegría, paz.</p>' +
      '<p>Actuás desde el <strong>sentido</strong>: «sé lo que valgo y lo que quiero aportar». Se mueve <em>a favor</em> de algo, no necesita enemigo, atrae en lugar de empujar y suma energía.</p>' +
      '<p class="small">Ejemplo: trabajar las mismas horas porque disfrutás lo que estás construyendo.</p></div></div>' +
      '<p class="small" style="margin:6px 0 0">Ninguno es «bueno» o «malo». Todos pasamos por los dos, incluso en el mismo día. Lo que cambia tu vida es desde cuál decidís. Este test te muestra cuál estás usando hoy.</p></div>' +
      '<p class="small" style="margin-top:16px">No hay respuestas correctas. Respondé lo que DE VERDAD pasa dentro tuyo, no lo que te gustaría que pasara.</p>' +
      '<button type="button" class="btn block" id="go" style="margin-top:8px">Medir mi nivel de consciencia →</button>' +
      "</div>";
    document.getElementById("go").addEventListener("click", function () {
      order = Q.map(function (q) { return shuffle(q.o); });
      qa = new Array(Q.length).fill(null);
      sa = new Array(SEG.length).fill(null);
      go(0);
    });
  }

  function renderName() {
    app.innerHTML =
      '<div class="screen">' +
      '<p class="eyebrow">Para personalizar tu resultado</p>' +
      "<h2>¿Cómo te llamás?</h2>" +
      '<form id="nf" novalidate><div class="field"><label for="nombre">Tu nombre</label>' +
      '<input id="nombre" name="nombre" type="text" autocomplete="given-name" maxlength="40"></div>' +
      '<button type="submit" class="btn block">Continuar</button></form>' +
      '<p class="small" style="margin-top:12px">Tu nombre solo aparece en tu pantalla.</p>' +
      backLink() + "</div>";
    var inp = document.getElementById("nombre");
    inp.value = name;
    inp.focus({ preventScroll: true });
    document.getElementById("nf").addEventListener("submit", function (e) {
      e.preventDefault();
      var v = inp.value.trim();
      if (!v) { inp.focus(); inp.setAttribute("aria-invalid", "true"); inp.placeholder = "Escribí tu nombre para seguir"; return; }
      name = v;
      go(cur + 1);
    });
    bindBack();
  }

  function optionsHtml(list, selected) {
    return list.map(function (o) {
      var txt = typeof o === "string" ? o : o[0];
      var val = typeof o === "string" ? o : o[1];
      return '<button type="button" class="opt' + (selected === val ? " sel" : "") + '" data-v="' + String(val).replace(/"/g, "&quot;") + '">' + txt + "</button>";
    }).join("");
  }

  function bindOpts(onPick) {
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b) {
      b.addEventListener("click", function () {
        Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (x) { x.classList.remove("sel"); });
        b.classList.add("sel");
        var v = b.getAttribute("data-v");
        setTimeout(function () { onPick(v); go(cur + 1); }, 220);
      });
    });
  }

  function renderQ(i) {
    app.innerHTML =
      '<div class="screen"><p class="eyebrow">Situación ' + (i + 1) + " de " + Q.length + "</p>" +
      '<h2 id="qt" tabindex="-1">' + Q[i].q + "</h2>" +
      '<div class="opts" role="group" aria-labelledby="qt">' + optionsHtml(order[i], qa[i]) + "</div>" + backLink() + "</div>";
    document.getElementById("qt").focus({ preventScroll: true });
    bindOpts(function (v) { qa[i] = Number(v); });
    bindBack();
  }

  function renderSeg(i) {
    var s = SEG[i];
    app.innerHTML =
      '<div class="screen"><p class="eyebrow">Sobre vos</p>' +
      '<h2 id="qt" tabindex="-1">' + s.q + "</h2>" + (s.sub ? '<p class="lead" style="margin-top:-8px">' + s.sub + "</p>" : "") +
      '<div class="opts" role="group" aria-labelledby="qt">' + optionsHtml(s.o, sa[i]) + "</div>" + backLink() + "</div>";
    document.getElementById("qt").focus({ preventScroll: true });
    bindOpts(function (v) { sa[i] = v; });
    bindBack();
  }

  var leadSent = false;
  function renderLead() {
    var r = compute();
    app.innerHTML =
      '<div class="screen">' +
      '<p class="eyebrow amb">Último paso</p>' +
      "<h2>Tu resultado está listo, " + name.replace(/</g, "&lt;") + ".</h2>" +
      '<p class="lead">¿Dónde te lo dejamos? Te mandamos tu consigna de la semana y Santi puede escribirte para acompañarte en tu próximo paso.</p>' +
      '<form id="lf" novalidate>' +
      '<div class="field"><label for="wa">Tu WhatsApp (con código de área)</label><input id="wa" type="tel" inputmode="tel" autocomplete="tel" maxlength="25" placeholder="Ej: 11 5555 5555"></div>' +
      '<div class="field"><label for="em">Tu mail (opcional)</label><input id="em" type="email" autocomplete="email" maxlength="80" placeholder="tu@mail.com"></div>' +
      '<div class="field" style="position:absolute;left:-9999px" aria-hidden="true"><label>Empresa</label><input id="emp" tabindex="-1" autocomplete="off"></div>' +
      '<p class="small" id="lerr" role="alert" style="color:var(--amber);min-height:1.2em"></p>' +
      '<button type="submit" class="btn block">Ver mi resultado →</button></form>' +
      '<p class="small" style="margin-top:12px">Solo lo usamos para enviarte tu resultado y propuestas de Santi. No hacemos spam y podés pedir que te saquemos cuando quieras.</p>' +
      backLink() + "</div>";
    document.getElementById("wa").focus({ preventScroll: true });
    document.getElementById("lf").addEventListener("submit", function (e) {
      e.preventDefault();
      var wa = document.getElementById("wa").value.replace(/[^\d+]/g, "");
      var em = document.getElementById("em").value.trim();
      var err = document.getElementById("lerr");
      var emOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em);
      if (wa.length < 8 && !emOk) { err.textContent = "Dejanos un WhatsApp válido o un mail para mostrarte tu resultado."; return; }
      if (em && !emOk) { err.textContent = "Revisá el mail: parece incompleto."; return; }
      if (!leadSent) {
        leadSent = true;
        try {
          fetch("/api/lead", { method: "POST", keepalive: true, headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre: name, whatsapp: wa, email: em, estado: r.st.t[1], empresa: document.getElementById("emp").value }) }).catch(function () {});
        } catch (x) {}
        if (typeof fbq !== "undefined") { fbq("track", "Lead"); }
      }
      go(cur + 1);
    });
    bindBack();
  }

  function compute() {
    var sum = qa.reduce(function (a, b) { return a + b; }, 0);
    var mean = sum / qa.length;
    var st = STATES.find(function (s) { return mean < s.max; }) || STATES[STATES.length - 1];
    var near = 0;
    MAP.forEach(function (m, i) { if (Math.abs(m[0] - mean) < Math.abs(MAP[near][0] - mean)) near = i; });
    var poder = qa.filter(function (v) { return v >= 200; }).length;
    return { mean: mean, st: st, near: near, poder: poder, fuerza: qa.length - poder };
  }

  function waText(meta) {
    var r = result;
    var lines = [
      "Hola Santi, soy " + name + ". Hice el test de consciencia de Sala Despertar.",
      "Mi estado dominante hoy: " + (r.st.t[0] + r.st.t[1]).toLowerCase() + ".",
      "Brújula: " + r.fuerza + " de 8 desde la Fuerza, " + r.poder + " desde el Poder."
    ];
    SEG.forEach(function (s, i) { if (sa[i]) lines.push(s.k + ": " + sa[i] + "."); });
    if (r.offer) lines.push("Me recomendaron: " + r.offer + ".");
    lines.push("Mi meta de esta semana: " + (meta && meta.trim() ? meta.trim() : "te la cuento por acá."));
    return lines.join("\n");
  }

  function contactHref(meta) {
    return CONFIG.whatsapp
      ? "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(waText(meta))
      : CONFIG.instagram;
  }

  function track(ev) { try { if (typeof fbq !== "undefined") { fbq("trackCustom", ev); } } catch (e) {} }

  function adviceHref() {
    var r = result;
    var t = "Hola Santi, soy " + name + ". Hice el test de consciencia de Sala Despertar (estado: " +
      (r.st.t[0] + r.st.t[1]).toLowerCase() + "). Me recomendaron: " + r.offer + ". Quiero reservar la sesión de claridad gratis.";
    return CONFIG.whatsapp ? "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(t) : CONFIG.instagram;
  }

  function li(t, d) { return "<li><b>" + t + "</b><span>" + d + "</span></li>"; }

  function offerHtml(of, nx) {
    var h = '<div class="box hl"><h3>Una invitación, sin letra chica</h3>';
    if (nx[0] === "reto") {
      h += "<p>Lo que viste hoy es tu punto de partida. Si querés que esta semana sea el primero de 21 días distintos, esto es lo que armé para vos.</p>" +
        "<p><strong>Reto de 21 días: dejá de abandonar lo que empezás</strong></p>" +
        '<p class="small">Tres etapas de 7 días: Romper, Construir y Consolidar. ' + nx[1] + "</p>" +
        '<ul class="stack">' +
        li("21 módulos, uno por día", "Cada día trae su tarea definida. No pensás qué hacer: lo hacés.") +
        li("Mentalidad, entrenamiento y nutrición en un solo sistema", "Rutina PPL con progresión, calculadora de macros y una sección diaria de Confrontación para trabajar lo que te frena.") +
        li("Comunidad privada de Ganadores y grupo de WhatsApp", "Gente que está en lo mismo que vos, todos los días.") +
        li("Bonus: Mapa de la Conciencia", "Lo que hiciste hoy llevado a tu día a día: cómo subir de nivel en lo concreto.") +
        li("Sesión de claridad 1 a 1 con Santi · sin costo", "30 minutos para mirar tu resultado juntos. Es tuya aunque decidas no entrar.") +
        li("Mi compromiso con el tuyo", "Si fallás un día, reiniciás desde el Día 1 y yo sigo ahí. No hay devolución mágica: hay compromiso de los dos.") +
        "</ul>" +
        '<p class="small"><strong>Es para vos si</strong> ya sabés qué hacer y no lográs sostenerlo, y podés darle 20 minutos diarios y entrenar. <strong>No es para vos si</strong> buscás resultados mágicos sin constancia.</p>' +
        ('<p id="precioln" hidden><strong>Inversión: <span id="precio"></span></strong> · pago único</p>') +
        '<a class="btn block" href="' + of.u + '" onclick="track(\'' + of.ev + '\')">' + of.b + "</a>" +
        '<div class="actions"><a class="btn ghost slim" id="advise" target="_blank" rel="noopener" onclick="track(\'TestASesion\')" href="' + adviceHref() + '">Antes quiero hablar con Santi (sesión gratis)</a></div>';
    } else {
      h += "<p>Si lo que viste te sirvió, esto es lo que puedo hacer por vos. No hace falta que decidas nada hoy.</p>" +
        '<ul class="stack">' +
        li("Sesión de claridad 1 a 1 con Santi · sin costo", "30 minutos. Miramos tu resultado juntos y te digo con honestidad qué haría en tu lugar.") +
        li(of.n, nx[1]) +
        li("Acompañamiento por WhatsApp los primeros 7 días", "Para que no te quedes solo con el plan cuando aparezca la duda.") +
        "</ul>" +
        '<a class="btn block" href="' + of.u + '" onclick="track(\'' + of.ev + '\')">' + of.b + "</a>" +
        '<div class="actions"><a class="btn ghost slim" id="advise" target="_blank" rel="noopener" onclick="track(\'TestASesion\')" href="' + adviceHref() + '">Antes quiero hablar con Santi (sesión gratis)</a></div>';
    }
    return h + '<p class="small" style="margin:14px 0 0">Si no es para vos, también está bien: el test y tus prácticas ya son tuyos.</p></div>';
  }

  function showResult() {
    result = compute();
    if (typeof fbq !== "undefined") { fbq("trackCustom", "TestCompletado"); }
    var r = result;
    var nx = NEXT[r.st.t[1]], of = OFFERS[nx[0]];
    r.offer = of.n;
    var rows = "";
    MAP.forEach(function (m, i) {
      var inZone = Math.abs(i - r.near) <= 1;
      rows += '<li class="' + (inZone ? "zone" : "") + '"><span class="nm">' + m[1] +
        (i === r.near ? '<span class="tag">HOY ESTÁS AQUÍ</span>' : "") + '</span><span class="v">' + m[0] + "</span></li>";
      if (m[0] === 200) rows += '<li class="cut" aria-hidden="true">La línea · 200</li>';
    });

    app.innerHTML =
      '<div class="screen">' +
      '<p class="eyebrow amb">Tu punto de partida · <span id="who"></span></p>' +
      '<p class="eyebrow" style="margin-top:6px">Tu estado dominante hoy</p>' +
      '<p class="state">' + r.st.t[0] + "<em>" + r.st.t[1] + "</em></p>" +
      "<p>" + r.st.d + "</p>" +
      '<div class="panel"><h3>Tu lugar en el mapa hoy</h3><ul class="map">' + rows + "</ul>" +
      '<p class="small" style="margin:0">Mapa de niveles de consciencia publicado por el Dr. David R. Hawkins. Se destaca la zona desde la que respondiste hoy: no es una calibración exacta ni un diagnóstico.</p></div>' +
      '<div class="panel"><h3>Tu brújula</h3>' +
      '<div class="compass" role="img" aria-label="' + r.fuerza + " respuestas desde la fuerza y " + r.poder + ' desde el poder"><b class="f" style="width:' + (r.fuerza / 8 * 100) + '%"></b><b class="p" style="width:' + (r.poder / 8 * 100) + '%"></b></div>' +
      '<div class="ends"><span>' + r.fuerza + " de 8 desde la Fuerza</span><span>" + r.poder + " desde el Poder</span></div></div>" +
      '<p class="quote">Esto no es quién sos. Es desde dónde estás operando hoy, y el estado se mueve.</p>' +
      '<div class="box"><h3>Tu consigna de la semana</h3><p>' + r.st.c + "</p></div>" +
      '<div class="box"><h3>Tus 3 prácticas de esta semana</h3><ul class="stack">' + PRACT[r.st.t[1]].map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>" +
      '<p class="small">Elegí una y hacela hoy. No hace falta las tres: hace falta empezar.</p></div>' +
      '<div class="box hl"><h3>Tu primera declaración</h3>' +
      "<p>Las metas que se quedan en la cabeza se negocian solas. Las que se dicen en voz alta pesan distinto. Escribí tu meta de esta semana y mandásela a Santi junto con tu resultado.</p>" +
      '<div class="field"><label for="meta">Mi meta de esta semana</label><textarea id="meta" rows="2" maxlength="200" placeholder="Esta semana voy a…"></textarea></div>' +
      '<a class="btn block" id="declare" target="_blank" rel="noopener" href="#">Declarar mi meta →</a>' +
      '<div class="actions"><button type="button" class="btn ghost slim" id="copy">Copiar mi resultado</button><button type="button" class="btn ghost slim" id="again">Repetir el test</button></div>' +
      '<textarea class="fallback" id="fb" rows="4" hidden readonly aria-label="Texto para copiar"></textarea></div>' +
      offerHtml(of, nx) +
      "</div>";

    document.getElementById("who").textContent = name.toUpperCase();
    if (nx[0] === "reto" && CONFIG.precioUrl) {
      try {
        fetch(CONFIG.precioUrl + "?v=" + Date.now(), { cache: "no-store" }).then(function (x) { return x.ok ? x.json() : null; }).then(function (j) {
          var n = j && Number(j.precio);
          if (n > 0) { document.getElementById("precio").textContent = "$" + n.toLocaleString("es-AR"); document.getElementById("precioln").hidden = false; }
        }).catch(function () {});
      } catch (e) {}
    }
    var meta = document.getElementById("meta");
    var declare = document.getElementById("declare");
    function sync() { var h = contactHref(meta.value); declare.href = h; }
    sync();
    meta.addEventListener("input", sync);

    document.getElementById("copy").addEventListener("click", function () {
      var btn = this, fb = document.getElementById("fb"), text = waText(meta.value);
      function done() { btn.textContent = "Copiado"; setTimeout(function () { btn.textContent = "Copiar mi resultado"; }, 2000); }
      function fallback() { fb.hidden = false; fb.value = text; fb.focus(); fb.select(); }
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
    });
    document.getElementById("again").addEventListener("click", function () { window.scrollTo(0, 0); go(-1); });

    prog.style.width = "100%";
    window.scrollTo(0, 0);
  }

  go(-1);
})();
</script>

</body></html>
