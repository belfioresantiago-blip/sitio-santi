[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/assets/*"]

[[redirects]]
  from = "/api/mp-webhook"
  to = "/.netlify/functions/mp-webhook"
  status = 200

[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200
